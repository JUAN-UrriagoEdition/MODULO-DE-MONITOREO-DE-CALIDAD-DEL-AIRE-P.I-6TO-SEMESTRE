# y pegar como lib/jSerialComm-2.11.0.jar
# O en NetBeans: Project Properties → Libraries → Add JAR/Folder → lib/jSerialComm-2.11.0.jar
javac.classpath=\
    ${file.reference.jSerialComm-2.11.4.jar}
